name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run unit & contract tests with coverage
        run: |
          PYTHONPATH=src pytest --cov=fritz_avm_client --cov-fail-under=90 tests/

      - name: Security scan with pip-audit
        run: |
          pip-audit

  package-smoke-test:
    name: Package Build & Wheel Install Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel package
        run: |
          pip install build
          python -m build

      - name: Install wheel in clean virtual environment
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl

      - name: Verify wheel import
        run: |
          source test_env/bin/activate
          python -c "import fritz_avm_client; from fritz_avm_client import FritzClient, Settings, MeshDiscovery; print('Import successful')"
