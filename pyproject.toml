[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fritz-avm-client"
version = "0.3.0"
description = "Extended Python client for AVM Fritz!Box routers with mesh topology, CPU temperatures, and advanced metrics"
authors = [
    {name = "Dominik Hahn", email = "dominik@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["fritzbox", "avm", "router", "mesh", "monitoring", "prometheus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
]

dependencies = [
    "fritzconnection>=1.13.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pip-audit>=2.6.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/domehahn/fritz-avm-client"
Repository = "https://github.com/domehahn/fritz-avm-client"
Issues = "https://github.com/domehahn/fritz-avm-client/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
